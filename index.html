<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji Find - Face Control Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Arial', sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; transform: scaleX(-1); }
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; color: white; text-shadow: 2px 2px 4px #000;
        }
        .header-ui { 
            display: flex; justify-content: space-around; align-items: center;
            background: rgba(0,0,0,0.85); height: 60px; width: 100%;
            border-bottom: 2px solid #0f0; color: #0f0; font-size: 32px; font-weight: bold;
        }
        .val-text { color: #fff; margin-left: 10px; }
        #msg { 
            position: absolute; top: 50%; left: 50%; 
            transform: translate(-50%, -50%); 
            font-size: 45px; text-align: center; color: #0f0;
            background: rgba(0,0,0,0.8); padding: 30px; border-radius: 20px;
            white-space: pre-wrap; z-index: 10; border: 3px solid #fff;
        }
    </style>
</head>
<body>

    <video id="input_video" style="display:none" playsinline></video>
    <canvas id="output_canvas"></canvas>
    
    <div id="ui-layer">
        <div class="header-ui">
            <div>SCORE: <span id="score" class="val-text">0</span></div>
            <div>TIME: <span id="timer" class="val-text">60</span></div>
        </div>
        <div id="msg">カメラを起動中...</div>
    </div>

<script>
const videoElement = document.getElementById('input_video');
const canvasElement = document.getElementById('output_canvas');
const canvasCtx = canvasElement.getContext('2d');
const scoreElement = document.getElementById('score');
const timerElement = document.getElementById('timer');
const msgElement = document.getElementById('msg');

// 設定
const COLS = 8;
const ROWS = 5;
const UI_MARGIN_TOP = 80;
const emojiPool = ['😉','😊','😋','☺️','🙂','🤨','😐','😑','🙄','😌','😔','😞'];

let score = 0;
let gameStarted = false;
let startTime = 0;
const gameDuration = 60; 
let countdown = gameDuration;

let fpo1x = 0.5, fpo1y = 0.5; 
let hiritu = 1.0;
let circles = [];
const cursorRadius = 60;

let canScore = true;
let hasClosedMouth = true;
let isCoolDown = false;
let hitEffectTimer = 0;

// 音声・読み上げ
const speech = window.speechSynthesis;
function speak(text) {
    if (speech.speaking) speech.cancel();
    const uttr = new SpeechSynthesisUtterance(text);
    uttr.lang = 'ja-JP';
    speech.speak(uttr);
}

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function beep(freq = 1000) {
    try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        osc.start();
        gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
        gainNode.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 0.02);
        gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.2);
        osc.stop(audioCtx.currentTime + 0.2);
    } catch(e) {}
}

// 問題作成 (1つだけ違う絵文字を配置)
function nextProblem() {
    circles = [];
    const width = window.innerWidth;
    const height = window.innerHeight - UI_MARGIN_TOP;
    
    const stepX = width / (COLS + 1);
    const stepY = height / (ROWS + 1);

    // 絵文字を2種類選ぶ
    let shuffled = [...emojiPool].sort(() => Math.random() - 0.5);
    const baseEmoji = shuffled[0];   // たくさん並ぶ方
    const targetEmoji = shuffled[1]; // 1つだけの正解

    // 正解の位置をランダムに決定
    const targetIndex = Math.floor(Math.random() * (COLS * ROWS));

    let count = 0;
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            const isTarget = (count === targetIndex);
            circles.push({
                x: width - (stepX * (c + 1)), // 反転考慮
                y: UI_MARGIN_TOP + (stepY * (r + 1)),
                emoji: isTarget ? targetEmoji : baseEmoji,
                isTarget: isTarget
            });
            count++;
        }
    }
}

function onResults(results) {
    if (canvasElement.width !== window.innerWidth || canvasElement.height !== window.innerHeight) {
        canvasElement.width = window.innerWidth;
        canvasElement.height = window.innerHeight;
    }
    const w = canvasElement.width;
    const h = canvasElement.height;

    canvasCtx.save();
    canvasCtx.clearRect(0, 0, w, h);
    canvasCtx.drawImage(results.image, 0, 0, w, h);

    if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks[0];
        
        // 顔の大きさから比率を計算 (facefaceのロジック)
        hiritu = (landmarks[152].y - landmarks[10].y) / 0.35;
        const po1x = landmarks[1].x;
        const po1y = landmarks[1].y;

        // カーソル位置の計算
        const rawX = 0.5 - (fpo1x - po1x) * 4; 
        const relativeY = 0.5 - (fpo1y - po1y) * 6; 
        const cursorX = rawX * w;
        const cursorY = relativeY * h;

        // 口の開閉判定
        const mouthOpenHeight = (landmarks[14].y - landmarks[13].y);
        const threshold = (0.015 - (Math.max(0, Math.min(1, relativeY)) * 0.008)) * hiritu;
        const mouthOpen = mouthOpenHeight > threshold;

        if (gameStarted) {
            msgElement.style.display = "none";

            // 絵文字グリッドの描画と判定
            let hoveringTarget = false;
            
            circles.forEach(c => {
                const dist = Math.sqrt((cursorX - c.x)**2 + (cursorY - c.y)**2);
                const isHover = dist < 60; // 判定距離

                canvasCtx.save();
                canvasCtx.translate(c.x, c.y);
                canvasCtx.scale(-1, 1); // 鏡像表示の補正
                
                // 描画
                canvasCtx.font = "60px serif";
                canvasCtx.textAlign = "center";
                canvasCtx.textBaseline = "middle";
                canvasCtx.fillText(c.emoji, 0, 0);
                canvasCtx.restore();

                // 正解判定
                if (isHover && c.isTarget) {
                    hoveringTarget = true;
                    if (mouthOpen && canScore) {
                        score++;
                        scoreElement.innerText = score;
                        beep(1200);
                        hitEffectTimer = 5;
                        canScore = false;
                        nextProblem(); 
                    }
                } else if (isHover && !c.isTarget && mouthOpen && canScore) {
                    // お手つき（不正解の絵文字で口を開けた）
                    beep(400);
                    canScore = false;
                }
            });

            // カーソル描画
            canvasCtx.beginPath();
            canvasCtx.arc(cursorX, cursorY, cursorRadius, 0, 2 * Math.PI);
            canvasCtx.lineWidth = 8;
            // 正解の上で口を開けようとしている時は色を変える
            canvasCtx.strokeStyle = (hoveringTarget && mouthOpen) ? "#FF69B4" : "#00FF00";
            canvasCtx.stroke();

            // 正解エフェクト
            if (hitEffectTimer > 0) {
                canvasCtx.beginPath();
                canvasCtx.arc(cursorX, cursorY, cursorRadius + (20 - hitEffectTimer * 4), 0, 2 * Math.PI);
                canvasCtx.strokeStyle = "white";
                canvasCtx.lineWidth = 4;
                canvasCtx.stroke();
                hitEffectTimer--;
            }

            // タイマー
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            countdown = Math.max(0, gameDuration - elapsed);
            timerElement.innerText = countdown;
            if (countdown <= 0) {
                gameStarted = false;
                hasClosedMouth = false;
                isCoolDown = true;
                speak(score + "点です。終了");
                setTimeout(() => { isCoolDown = false; }, 3000);
            }
        } else {
            //待機画面
            canvasCtx.beginPath();
            canvasCtx.arc(cursorX, cursorY, cursorRadius, 0, 2 * Math.PI);
            canvasCtx.lineWidth = 8;
            canvasCtx.strokeStyle = "#00FF00";
            canvasCtx.stroke();

            msgElement.style.display = "block";
            if (isCoolDown) {
                msgElement.innerText = "終了！ スコア: " + score;
            } else if (!hasClosedMouth) {
                msgElement.innerText = "一度口を閉じてください";
            } else {
                msgElement.innerText = "口を開けてスタート！";
                if (mouthOpen) {
                    fpo1x = landmarks[1].x;
                    fpo1y = landmarks[1].y;
                    gameStarted = true;
                    startTime = Date.now();
                    score = 0;
                    scoreElement.innerText = score;
                    canScore = false; 
                    nextProblem();
                    speak("スタート");
                }
            }
        }

        if (!mouthOpen) {
            canScore = true;
            hasClosedMouth = true;
        }
    }
    canvasCtx.restore();
}

const faceMesh = new FaceMesh({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});
faceMesh.setOptions({
    maxNumFaces: 1, refineLandmarks: false,
    minDetectionConfidence: 0.5, minTrackingConfidence: 0.5
});
faceMesh.onResults(onResults);

const camera = new Camera(videoElement, {
    onFrame: async () => { await faceMesh.send({image: videoElement}); },
    width: 1280, height: 720
});
camera.start();

window.addEventListener('resize', () => {
    if (gameStarted) nextProblem();
});
window.addEventListener('keydown', (e) => {
    if (e.key === "Escape") location.reload();
});
</script>
</body>
</html>
